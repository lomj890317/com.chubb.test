server.port=8080
spring.application.name=TestApplication

# URL de conexión a la base de datos en memoria (H2)
spring.datasource.url=jdbc:h2:mem:testdb

# Driver JDBC de H2
spring.datasource.driver-class-name=org.h2.Driver

# Credenciales de acceso
spring.datasource.username=sa
spring.datasource.password=

# Habilitar la consola web de H2
spring.h2.console.enabled=true

# Ruta para acceder a la consola (por defecto /h2-console)
spring.h2.console.path=/h2-console

# Configuración de Hibernate / JPA para manejo de tablas
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
